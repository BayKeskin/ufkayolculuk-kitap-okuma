name: Demo Siteye Otomatik Dağıtım (FTP Deploy)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manuel tetikleme butonu ekler

jobs:
  web-deploy:
    name: FTP ile Canlıya Dağıt
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: PHP ve Composer Kurulumu
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, json, curl

      - name: Composer Bağımlılıklarını Yükle
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: FTP Senkronizasyonu
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          server-dir: /
          log-level: verbose
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.agents/**
            .idea/**
            *.md
            .env
            writable/cache/**
            writable/logs/**
            writable/session/**
            writable/debugbar/**
            tests/**
            phpunit.dist.xml
