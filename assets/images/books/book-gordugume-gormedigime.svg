<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <!-- Soft floor shadow -->
    <filter id="bookDropShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="8" dy="18" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3"/>
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="pageEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="20%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="icebergGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="coverShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="15%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="85%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.08)"/>
    </linearGradient>
  </defs>

  <g filter="url(#bookDropShadow)">
    <!-- 3D Page Thickness Edge (Right Side) -->
    <polygon points="280,30 295,20 295,395 280,410" fill="url(#pageEdge)"/>
    <line x1="285" y1="26" x2="285" y2="402" stroke="#94a3b8" stroke-width="0.75" opacity="0.6"/>
    <line x1="290" y1="23" x2="290" y2="398" stroke="#cbd5e1" stroke-width="0.75" opacity="0.6"/>

    <!-- Main Front Cover -->
    <rect x="10" y="30" width="270" height="380" rx="4" fill="#ffffff"/>

    <!-- Red Top Band -->
    <rect x="10" y="30" width="270" height="32" rx="4" fill="#ef4444"/>
    <rect x="10" y="58" width="270" height="4" fill="#ef4444"/>

    <!-- Red Ufka Yolculuk Circular Badge Top Center -->
    <circle cx="145" cy="46" r="14" fill="#991b1b"/>
    <circle cx="145" cy="46" r="12" fill="#dc2626"/>
    <text x="145" y="44" font-family="'Roboto', sans-serif" font-size="5.5" font-weight="900" fill="#ffffff" text-anchor="middle">UFKA</text>
    <text x="145" y="51" font-family="'Roboto', sans-serif" font-size="4.5" font-weight="900" fill="#ffffff" text-anchor="middle">YOLCULUK</text>
    <text x="50" y="48" font-family="'Roboto', sans-serif" font-size="7" font-weight="700" fill="#ffffff">LİSE DÜZEYİ</text>
    <text x="240" y="48" font-family="'Roboto', sans-serif" font-size="7" font-weight="700" fill="#ffffff">13. YIL</text>

    <!-- White Cover Background -->
    <!-- Book Title -->
    <text x="145" y="115" font-family="'Roboto', sans-serif" font-size="26" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="-0.5">gördüğüme</text>
    <text x="145" y="142" font-family="'Roboto', sans-serif" font-size="24" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="-0.5">görmediğime</text>

    <!-- Iceberg Illustration in Center -->
    <g transform="translate(45, 175)">
      <!-- Water line / horizon -->
      <line x1="0" y1="65" x2="200" y2="65" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3"/>
      
      <!-- Above Water Peak -->
      <polygon points="100,5 125,65 75,65" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
      <polygon points="100,5 125,65 105,65" fill="#ffedd5"/>
      
      <!-- Below Water Iceberg Geometric Structure -->
      <polygon points="75,65 125,65 145,120 100,185 55,130" fill="url(#icebergGrad)"/>
      <polygon points="75,65 100,65 100,185 55,130" fill="#ea580c" opacity="0.8"/>
      <polygon points="100,65 125,65 145,120 100,185" fill="#f97316" opacity="0.9"/>
      <polygon points="100,65 115,110 100,185 85,120" fill="#fb923c"/>
      
      <!-- Floating particles / space items inside iceberg -->
      <circle cx="95" cy="115" r="7" fill="#ffffff" opacity="0.8"/>
      <circle cx="115" cy="140" r="4" fill="#ffffff" opacity="0.7"/>
      <polygon points="80,140 85,150 75,150" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Publisher logo at bottom -->
    <circle cx="145" cy="385" r="10" fill="#ef4444" opacity="0.2"/>
    <text x="145" y="388" font-family="'Roboto', sans-serif" font-size="8" font-weight="900" fill="#ef4444" text-anchor="middle">UY</text>

    <!-- 3D Sheen and Spine Shadow on Cover -->
    <rect x="10" y="30" width="270" height="380" rx="4" fill="url(#coverShine)" pointer-events="none"/>
    <line x1="18" y1="30" x2="18" y2="410" stroke="rgba(0,0,0,0.12)" stroke-width="2"/>
    <line x1="19" y1="30" x2="19" y2="410" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
  </g>
</svg>
