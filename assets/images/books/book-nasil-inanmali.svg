<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <!-- Soft floor shadow -->
    <filter id="bookDropShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="8" dy="18" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3"/>
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="pageEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="20%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="coverShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="15%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="85%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.15)"/>
    </linearGradient>
  </defs>

  <g filter="url(#bookDropShadow)">
    <!-- 3D Page Thickness Edge (Right Side) -->
    <polygon points="280,30 295,20 295,395 280,410" fill="url(#pageEdge)"/>
    <line x1="285" y1="26" x2="285" y2="402" stroke="#94a3b8" stroke-width="0.75" opacity="0.6"/>
    <line x1="290" y1="23" x2="290" y2="398" stroke="#cbd5e1" stroke-width="0.75" opacity="0.6"/>

    <!-- Main Front Cover -->
    <rect x="10" y="30" width="270" height="380" rx="4" fill="#047857"/>

    <!-- Light Green Top Banner -->
    <rect x="10" y="30" width="270" height="32" rx="4" fill="#10b981"/>
    <rect x="10" y="58" width="270" height="4" fill="#10b981"/>

    <!-- Red Ufka Yolculuk Circular Badge Top Center -->
    <circle cx="145" cy="46" r="14" fill="#dc2626"/>
    <circle cx="145" cy="46" r="12" fill="#ef4444"/>
    <text x="145" y="44" font-family="'Roboto', sans-serif" font-size="5.5" font-weight="900" fill="#ffffff" text-anchor="middle">UFKA</text>
    <text x="145" y="51" font-family="'Roboto', sans-serif" font-size="4.5" font-weight="900" fill="#ffffff" text-anchor="middle">YOLCULUK</text>
    <text x="50" y="48" font-family="'Roboto', sans-serif" font-size="7" font-weight="700" fill="#ffffff">YETİŞKİN DÜZEYİ</text>
    <text x="240" y="48" font-family="'Roboto', sans-serif" font-size="7" font-weight="700" fill="#ffffff">13. YIL</text>

    <!-- Emerald Green Cover Background -->
    <!-- Subtitle / Edition -->
    <text x="145" y="90" font-family="'Roboto', sans-serif" font-size="9" font-weight="700" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">YENİ YAYINLAR</text>

    <!-- Book Title -->
    <text x="145" y="118" font-family="'Roboto', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">NASIL</text>
    <text x="145" y="148" font-family="'Roboto', sans-serif" font-size="28" font-weight="900" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">İNANMALI?</text>
    <text x="145" y="170" font-family="'Roboto', sans-serif" font-size="10" font-weight="500" fill="#d1fae5" text-anchor="middle">Prof. Dr. İsmail KARA</text>

    <!-- Islamic Mandala Rosette Illustration in Center -->
    <g transform="translate(145, 265)">
      <!-- Outer circles -->
      <circle cx="0" cy="0" r="65" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.4"/>
      <circle cx="0" cy="0" r="58" fill="none" stroke="#a7f3d0" stroke-width="1" stroke-dasharray="3,3"/>
      <circle cx="0" cy="0" r="50" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>

      <!-- 8-pointed star / Rosette pattern -->
      <g stroke="#a7f3d0" stroke-width="1.5" fill="none">
        <rect x="-30" y="-30" width="60" height="60" rx="3"/>
        <rect x="-30" y="-30" width="60" height="60" rx="3" transform="rotate(45)"/>
        <circle cx="0" cy="0" r="22" fill="#064e3b" stroke="#6ee7b7" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="11" fill="#10b981" stroke="#ecfdf5" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="4" fill="#ffffff"/>
      </g>
    </g>

    <!-- Publisher logo at bottom -->
    <circle cx="145" cy="385" r="10" fill="#ffffff" opacity="0.3"/>
    <text x="145" y="388" font-family="'Roboto', sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">UY</text>

    <!-- 3D Sheen and Spine Shadow on Cover -->
    <rect x="10" y="30" width="270" height="380" rx="4" fill="url(#coverShine)" pointer-events="none"/>
    <line x1="18" y1="30" x2="18" y2="410" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>
    <line x1="19" y1="30" x2="19" y2="410" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  </g>
</svg>
