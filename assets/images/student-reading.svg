<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Potted Plant on Left -->
  <g transform="translate(15, 70)">
    <!-- Pot -->
    <polygon points="12,70 38,70 34,100 16,100" fill="#f97316"/>
    <rect x="10" y="66" width="30" height="6" rx="2" fill="#ea580c"/>
    <!-- Leaves -->
    <path d="M25 66 Q10 40 5 15 Q25 35 25 66 Z" fill="#10b981"/>
    <path d="M25 66 Q30 30 45 10 Q40 40 25 66 Z" fill="#059669"/>
    <path d="M25 66 Q15 45 -5 35 Q15 55 25 66 Z" fill="#34d399"/>
    <path d="M25 66 Q35 50 55 45 Q35 60 25 66 Z" fill="#047857"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="130" cy="165" rx="90" ry="8" fill="#e2e8f0"/>

  <!-- Sitting Student Figure -->
  <g transform="translate(60, 20)">
    <!-- Legs (Cross-legged sitting) -->
    <path d="M45 125 C45 125 15 135 10 142 C5 148 20 152 40 148 C55 145 75 140 85 130 Z" fill="url(#pants)"/>
    <path d="M75 125 C75 125 105 135 110 142 C115 148 100 152 80 148 C65 145 50 140 40 130 Z" fill="url(#pants)"/>
    <!-- Shoes -->
    <ellipse cx="10" cy="144" rx="8" ry="5" fill="#f8fafc"/>
    <ellipse cx="110" cy="144" rx="8" ry="5" fill="#f8fafc"/>

    <!-- Torso / Hoodie -->
    <path d="M40 70 C40 70 32 100 35 130 C45 135 75 135 85 130 C88 100 80 70 80 70 Z" fill="url(#hoodie)"/>
    
    <!-- Arms holding book -->
    <!-- Left arm -->
    <path d="M38 75 C30 85 25 105 45 112 C48 114 55 112 55 108" fill="none" stroke="url(#hoodie)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right arm -->
    <path d="M82 75 C90 85 95 105 75 112 C72 114 65 112 65 108" fill="none" stroke="url(#hoodie)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Hands -->
    <circle cx="50" cy="110" r="6" fill="url(#skin)"/>
    <circle cx="70" cy="110" r="6" fill="url(#skin)"/>

    <!-- Open Book -->
    <g transform="translate(60, 110)">
      <!-- Left Page -->
      <polygon points="0,0 -26,-10 -26,10 0,16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Right Page -->
      <polygon points="0,0 26,-10 26,10 0,16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Spine -->
      <line x1="0" y1="0" x2="0" y2="16" stroke="#0284c7" stroke-width="2"/>
      <!-- Bookmark ribbon -->
      <path d="M0 16 Q3 24 6 22" fill="none" stroke="#ef4444" stroke-width="2"/>
    </g>

    <!-- Head & Hair -->
    <!-- Neck -->
    <rect x="55" y="55" width="10" height="15" fill="url(#skin)"/>
    <!-- Head -->
    <ellipse cx="60" cy="45" rx="14" ry="16" fill="url(#skin)"/>
    <!-- Glasses -->
    <circle cx="56" cy="45" r="4" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="66" cy="45" r="4" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="60" y1="45" x2="62" y2="45" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Hair -->
    <path d="M44 42 C42 22 76 20 76 38 C72 32 62 30 52 35 C48 37 45 40 44 42 Z" fill="#1e293b"/>
  </g>
</svg>
