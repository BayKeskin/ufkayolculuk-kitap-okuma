<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <!-- Soft floor shadow -->
    <filter id="bookDropShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="8" dy="18" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3"/>
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="pageEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="20%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="coverShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="15%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="85%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.15)"/>
    </linearGradient>
  </defs>

  <g filter="url(#bookDropShadow)">
    <!-- 3D Page Thickness Edge (Right Side) -->
    <!-- Top page edge -->
    <polygon points="280,30 295,20 295,395 280,410" fill="url(#pageEdge)"/>
    <!-- Page lines pattern on edge -->
    <line x1="285" y1="26" x2="285" y2="402" stroke="#94a3b8" stroke-width="0.75" opacity="0.6"/>
    <line x1="290" y1="23" x2="290" y2="398" stroke="#cbd5e1" stroke-width="0.75" opacity="0.6"/>

    <!-- Main Front Cover -->
    <rect x="10" y="30" width="270" height="380" rx="4" fill="#581c87"/>

    <!-- White Top Banner -->
    <rect x="10" y="30" width="270" height="32" rx="4" fill="#ffffff"/>
    <rect x="10" y="58" width="270" height="4" fill="#ffffff"/>

    <!-- Red Ufka Yolculuk Circular Badge Top Center -->
    <circle cx="145" cy="46" r="14" fill="#dc2626"/>
    <circle cx="145" cy="46" r="12" fill="#ef4444"/>
    <text x="145" y="44" font-family="'Roboto', sans-serif" font-size="5.5" font-weight="900" fill="#ffffff" text-anchor="middle">UFKA</text>
    <text x="145" y="51" font-family="'Roboto', sans-serif" font-size="4.5" font-weight="900" fill="#ffffff" text-anchor="middle">YOLCULUK</text>
    <text x="50" y="48" font-family="'Roboto', sans-serif" font-size="7" font-weight="700" fill="#9333ea">İLKOKUL DÜZEYİ</text>
    <text x="240" y="48" font-family="'Roboto', sans-serif" font-size="7" font-weight="700" fill="#9333ea">13. YIL</text>

    <!-- Cover Purple Background -->
    <!-- Book Title -->
    <text x="145" y="110" font-family="'Roboto', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">KUŞLARIN</text>
    <text x="145" y="145" font-family="'Roboto', sans-serif" font-size="38" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="1.5">ÇAĞRISI</text>

    <!-- Illustration Area -->
    <g transform="translate(30, 160)">
      <!-- Tree and birds -->
      <path d="M115 150 Q118 70 120 40 Q122 70 125 150 Z" fill="#854d0e"/>
      <ellipse cx="120" cy="35" rx="55" ry="35" fill="#fde047" opacity="0.6"/>
      <ellipse cx="120" cy="30" rx="45" ry="28" fill="#eab308" opacity="0.8"/>
      
      <!-- Birds in sky -->
      <path d="M80 15 Q90 5 100 15 Q110 5 120 15" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M135 5 Q145 -3 155 5 Q165 -3 175 5" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Kids holding drawing/book -->
      <!-- Kid Left Top -->
      <circle cx="80" cy="75" r="14" fill="#fed7aa"/>
      <path d="M68 70 C68 55 92 55 92 70 Z" fill="#3b0764"/>
      <path d="M65 90 L95 90 L92 130 L68 130 Z" fill="#38bdf8"/>

      <!-- Kid Right Top -->
      <circle cx="160" cy="75" r="14" fill="#fed7aa"/>
      <path d="M148 70 C148 55 172 55 172 70 Z" fill="#78350f"/>
      <path d="M145 90 L175 90 L172 130 L148 130 Z" fill="#f43f5e"/>

      <!-- Big Sheet held by kids -->
      <polygon points="85,85 155,80 150,150 80,155" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
      <path d="M115 145 Q118 100 120 90" stroke="#713f12" stroke-width="3" fill="none"/>
      
      <!-- Kid Bottom Left -->
      <circle cx="75" cy="160" r="14" fill="#fed7aa"/>
      <path d="M63 155 C63 140 87 140 87 155 Z" fill="#1e1b4b"/>
      <path d="M60 175 L90 175 L85 200 L65 200 Z" fill="#eab308"/>

      <!-- Kid Bottom Right -->
      <circle cx="165" cy="160" r="14" fill="#fed7aa"/>
      <path d="M153 155 C153 140 177 140 177 155 Z" fill="#451a03"/>
      <path d="M150 175 L180 175 L175 200 L155 200 Z" fill="#a855f7"/>

      <!-- Green grass band -->
      <path d="M-20 200 L250 200 L250 250 L-20 250 Z" fill="#65a30d"/>
    </g>

    <!-- Publisher logo at bottom -->
    <circle cx="145" cy="385" r="10" fill="#ffffff" opacity="0.3"/>
    <text x="145" y="388" font-family="'Roboto', sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">UY</text>

    <!-- 3D Sheen and Spine Shadow on Cover -->
    <rect x="10" y="30" width="270" height="380" rx="4" fill="url(#coverShine)" pointer-events="none"/>
    <line x1="18" y1="30" x2="18" y2="410" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>
    <line x1="19" y1="30" x2="19" y2="410" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  </g>
</svg>
