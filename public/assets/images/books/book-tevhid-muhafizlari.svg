<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <!-- Soft floor shadow -->
    <filter id="bookDropShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="8" dy="18" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3"/>
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="pageEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="20%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="coverShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="15%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="85%" flood-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.15)"/>
    </linearGradient>
  </defs>

  <g filter="url(#bookDropShadow)">
    <!-- 3D Page Thickness Edge (Right Side) -->
    <polygon points="280,30 295,20 295,395 280,410" fill="url(#pageEdge)"/>
    <line x1="285" y1="26" x2="285" y2="402" stroke="#94a3b8" stroke-width="0.75" opacity="0.6"/>
    <line x1="290" y1="23" x2="290" y2="398" stroke="#cbd5e1" stroke-width="0.75" opacity="0.6"/>

    <!-- Main Front Cover -->
    <rect x="10" y="30" width="270" height="380" rx="4" fill="#0284c7"/>

    <!-- White Top Banner -->
    <rect x="10" y="30" width="270" height="32" rx="4" fill="#ffffff"/>
    <rect x="10" y="58" width="270" height="4" fill="#ffffff"/>

    <!-- Red Ufka Yolculuk Circular Badge Top Center -->
    <circle cx="145" cy="46" r="14" fill="#dc2626"/>
    <circle cx="145" cy="46" r="12" fill="#ef4444"/>
    <text x="145" y="44" font-family="'Roboto', sans-serif" font-size="5.5" font-weight="900" fill="#ffffff" text-anchor="middle">UFKA</text>
    <text x="145" y="51" font-family="'Roboto', sans-serif" font-size="4.5" font-weight="900" fill="#ffffff" text-anchor="middle">YOLCULUK</text>
    <text x="50" y="48" font-family="'Roboto', sans-serif" font-size="7" font-weight="700" fill="#0284c7">ORTAOKUL DÜZEYİ</text>
    <text x="240" y="48" font-family="'Roboto', sans-serif" font-size="7" font-weight="700" fill="#0284c7">13. YIL</text>

    <!-- Blue Cover Background -->
    <!-- Book Title -->
    <text x="145" y="115" font-family="'Roboto', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">TEVHİD</text>
    <text x="145" y="145" font-family="'Roboto', sans-serif" font-size="20" font-weight="800" fill="#bae6fd" text-anchor="middle" letter-spacing="2">MUHAFIZLARI</text>

    <!-- Blueprint Grid Lines -->
    <g stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="2,4">
      <line x1="20" y1="180" x2="270" y2="180"/>
      <line x1="20" y1="230" x2="270" y2="230"/>
      <line x1="20" y1="280" x2="270" y2="280"/>
      <line x1="20" y1="330" x2="270" y2="330"/>
      <line x1="80" y1="160" x2="80" y2="360"/>
      <line x1="145" y1="160" x2="145" y2="360"/>
      <line x1="210" y1="160" x2="210" y2="360"/>
    </g>

    <!-- Superhero Boy Illustration -->
    <g transform="translate(65, 170)">
      <!-- Shield circle -->
      <circle cx="80" cy="80" r="65" fill="#38bdf8" opacity="0.25"/>
      <circle cx="80" cy="80" r="55" fill="none" stroke="#ffffff" stroke-width="2"/>
      
      <!-- Trophy held by boy -->
      <path d="M40 40 L50 40 L48 60 Q45 70 40 70 Q35 70 32 60 Z" fill="#fbbf24"/>
      
      <!-- Head -->
      <circle cx="80" cy="55" r="22" fill="#fed7aa"/>
      <path d="M58 50 C58 25 102 25 102 50 C100 40 60 40 58 50 Z" fill="#0f172a"/>
      <circle cx="73" cy="55" r="3" fill="#0f172a"/>
      <circle cx="87" cy="55" r="3" fill="#0f172a"/>
      <path d="M74 64 Q80 70 86 64" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

      <!-- Body / Cape -->
      <path d="M55 80 L35 150 L125 150 L105 80 Z" fill="#0369a1"/>
      <path d="M60 78 C60 78 70 75 80 75 C90 75 100 78 100 78 L105 140 L55 140 Z" fill="#ffffff"/>
      
      <!-- Soccer ball / emblem at bottom -->
      <circle cx="95" cy="130" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
      <polygon points="95,122 101,126 99,134 91,134 89,126" fill="#0f172a"/>
    </g>

    <!-- Publisher logo at bottom -->
    <circle cx="145" cy="385" r="10" fill="#ffffff" opacity="0.3"/>
    <text x="145" y="388" font-family="'Roboto', sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">UY</text>

    <!-- 3D Sheen and Spine Shadow on Cover -->
    <rect x="10" y="30" width="270" height="380" rx="4" fill="url(#coverShine)" pointer-events="none"/>
    <line x1="18" y1="30" x2="18" y2="410" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>
    <line x1="19" y1="30" x2="19" y2="410" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  </g>
</svg>
