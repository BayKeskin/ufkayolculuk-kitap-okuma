<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Background -->
    <rect width="100" height="100" fill="url(#bgGrad)"/>
    
    <!-- Body / Shirt -->
    <path d="M20 95 C20 75 35 70 50 70 C65 70 80 75 80 95 Z" fill="#0f172a"/>
    <polygon points="50,70 42,85 58,85" fill="#f8fafc"/>
    
    <!-- Neck -->
    <rect x="44" y="55" width="12" height="18" fill="#fbcfe8"/>
    
    <!-- Head -->
    <ellipse cx="50" cy="45" rx="18" ry="20" fill="#fed7aa"/>
    
    <!-- Beard / Stubble -->
    <path d="M33 46 C33 62 40 68 50 68 C60 68 67 62 67 46 C67 52 60 63 50 63 C40 63 33 52 33 46 Z" fill="#334155"/>
    <path d="M42 58 Q50 60 58 58" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Eyes -->
    <circle cx="43" cy="42" r="2.5" fill="#1e293b"/>
    <circle cx="57" cy="42" r="2.5" fill="#1e293b"/>
    <!-- Eyebrows -->
    <path d="M39 37 Q44 35 48 37" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M52 37 Q56 35 61 37" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Hair -->
    <path d="M30 40 C30 20 70 20 70 40 C68 28 58 24 50 25 C42 24 32 28 30 40 Z" fill="#1e293b"/>
  </g>
  <!-- Circle Border -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#ffffff" stroke-width="3"/>
</svg>
